<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb">
<meta name="description" content="行迹中国，为每一段旅程，寻一处值得停留的风景。探索中国目的地与精心设计的旅行线路。">
<title>行迹中国 · 发现中国的另一面</title>
<link rel="preconnect" href="https://images.unsplash.com">
<style>
:root{color-scheme:light;--paper:#f4f3ed;--surface:#fffefa;--ink:#26332e;--muted:#747d75;--line:#dfe3d9;--green:#3d6558;--green-dark:#23483e;--gold:#c1a675;--white:#fffefa;--shadow:0 20px 60px #20231c15;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--paper:#18211e;--surface:#222d28;--ink:#f1f0e8;--muted:#b4bdb2;--line:#3b4941;--green:#b8cdbd;--green-dark:#d8e2d7;--gold:#d7bd8a;--white:#f4f3ed;--shadow:0 20px 60px #0004}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:82px}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 var(--sans)}
button,input,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover;color:transparent}
button{color:inherit}
.site-header{position:fixed;inset:0 0 auto;z-index:20;color:#fff;transition:background .3s,color .3s,box-shadow .3s}
.site-header.is-scrolled{background:color-mix(in srgb,var(--surface) 94%,transparent);color:var(--ink);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(16px)}
.site-header.is-page{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(16px);transition:none}
.nav-wrap{width:min(1440px,100%);height:82px;margin:auto;padding:0 5.5%;display:flex;align-items:center;gap:40px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto}
.brand-mark{width:35px;height:35px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font:600 20px/1 var(--sans)}
.brand-copy{display:grid;line-height:1.15}
.brand-copy strong{font:700 16px var(--sans);letter-spacing:.08em}
.brand-copy small{margin-top:5px;font:600 9px var(--sans);letter-spacing:.15em;opacity:.8}
.nav-links{display:flex;align-items:center;gap:34px}
.nav-links a{font-size:12px;font-weight:600;letter-spacing:.08em;text-decoration:none;opacity:.86;transition:opacity .2s}
.nav-links a:hover,.nav-links a.on{opacity:1}
.nav-actions{display:flex;align-items:center;gap:12px}
.icon-button,.menu-button{border:0;background:none;color:inherit;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;font-size:17px}
.menu-button{display:none}
.nav-book{border:1px solid currentColor;padding:10px 20px;text-decoration:none;font-size:10px;font-weight:650;letter-spacing:.12em;transition:background .2s,color .2s}
.nav-book:hover{background:var(--white);color:var(--green-dark)}
.site-header.is-scrolled .nav-book:hover{background:var(--green);color:#fff}
main{min-height:70vh}
.hero{height:min(920px,100svh);min-height:650px;position:relative;overflow:hidden;background:#293b37;color:#fff}
.hero-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}
.hero-slide.active{opacity:1;visibility:visible}
.hero-slide img{position:absolute;inset:0;object-position:center 55%;animation:slow-zoom 9s ease-out both}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,#14251fd1 0%,#14251f85 42%,#14251f0a 100%),linear-gradient(0deg,#14251f78 0%,transparent 38%)}
.hero-copy{position:absolute;left:11%;top:46%;transform:translateY(-42%);width:min(660px,78%)}
.eyebrow{display:flex;align-items:center;gap:13px;font-size:10px;font-weight:650;letter-spacing:.2em;text-transform:uppercase}
.eyebrow:before{content:"";width:34px;height:1px;background:var(--gold)}
.hero h1{font:700 clamp(44px,7vw,94px)/1.13 var(--sans);letter-spacing:-.035em;margin:28px 0 18px;max-width:760px}
.hero h1 em,.section-title em{font-weight:700;color:#d9c69e;font-style:normal}
.hero-copy p{max-width:430px;color:#ffffffd9;font-size:14px;letter-spacing:.06em;margin:0 0 32px}
.text-link{display:inline-flex;align-items:center;gap:17px;text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.12em}
.text-link span{width:42px;height:42px;border:1px solid #ffffffa6;border-radius:50%;display:grid;place-items:center;transition:transform .25s,background .25s}
.text-link:hover span{transform:translateX(4px);background:#ffffff24}
.hero-bottom{position:absolute;left:5.5%;right:5.5%;bottom:42px;display:flex;align-items:center;justify-content:space-between}
.hero-count{font:600 12px var(--sans);letter-spacing:.12em}
.hero-controls{display:flex;align-items:center;gap:12px}
.hero-arrow{width:42px;height:42px;border:1px solid #ffffff8c;background:transparent;color:#fff;border-radius:50%;cursor:pointer;font-size:18px;transition:background .2s}
.hero-arrow:hover{background:#ffffff25}
.hero-dots{display:flex;gap:8px;margin:0 12px}
.hero-dot{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:#ffffff75;cursor:pointer}
.hero-dot.active{background:#fff;transform:scale(1.35)}
.scroll-note{position:absolute;right:5.5%;top:48%;writing-mode:vertical-rl;font-size:9px;letter-spacing:.23em;opacity:.78}
.intro{padding:130px 8% 120px;text-align:center;max-width:1000px;margin:auto}
.intro .eyebrow{justify-content:center;color:var(--muted)}
.intro h2{font:650 clamp(32px,5vw,58px)/1.3 var(--sans);letter-spacing:-.035em;max-width:840px;margin:27px auto 22px}
.intro h2 em{color:var(--green);font-style:normal;font-weight:700}
.intro p{max-width:580px;margin:auto;color:var(--muted);font-size:14px}
.section{width:min(1320px,100%);margin:auto;padding:0 5.5% 130px}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:34px}
.section-heading .eyebrow{color:var(--muted)}
.section-title{font:700 clamp(31px,4vw,48px)/1.25 var(--sans);margin:14px 0 0;letter-spacing:-.03em}
.section-title em{color:var(--green);font-style:normal}
.section-note{max-width:300px;color:var(--muted);font-size:12px;margin:0 0 5px}
.destination-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
.destination-card{position:relative;min-height:420px;overflow:hidden;color:#fff;text-decoration:none;background:#293b37}
.destination-card:nth-child(4n+1),.destination-card:nth-child(4n+4){grid-column:span 7}
.destination-card:nth-child(4n+2),.destination-card:nth-child(4n+3){grid-column:span 5}
.destination-card img{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.destination-card:after{content:"";position:absolute;inset:25% 0 0;background:linear-gradient(0deg,#172b25df,transparent)}
.destination-meta{position:absolute;z-index:1;left:30px;right:30px;bottom:27px;display:flex;align-items:end;justify-content:space-between;gap:20px}
.destination-meta small{display:block;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#ffffffd9}
.destination-meta h3{font:700 clamp(27px,3vw,40px) var(--sans);letter-spacing:-.025em;margin:6px 0}
.destination-meta p{font-size:12px;color:#ffffffc7;margin:0}
.destination-arrow{flex:none;width:42px;height:42px;border:1px solid #ffffff9e;border-radius:50%;display:grid;place-items:center;font-size:18px;transition:transform .2s}
.destination-card:hover .destination-arrow{transform:translateX(4px)}
.experience{display:grid;grid-template-columns:1fr 1fr;min-height:590px;background:var(--green-dark);color:#f8f6ef;margin-bottom:130px}
.experience-photo{min-height:520px;position:relative;overflow:hidden}
.experience-photo img{position:absolute;inset:0}
.experience-copy{padding:clamp(48px,8vw,112px) clamp(36px,8vw,110px);display:flex;flex-direction:column;justify-content:center}
.experience-copy .eyebrow{color:#d0d0c3}
.experience-copy h2{font:700 clamp(34px,4vw,54px)/1.25 var(--sans);letter-spacing:-.03em;margin:27px 0 18px}
.experience-copy h2 em{color:#d9c69e;font-style:normal;font-weight:700}
.experience-copy p{max-width:420px;color:#ffffffbd;font-size:13px;margin:0 0 29px}
.experience-copy .text-link span{border-color:#ffffff8a}
.journal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.journal-card{background:var(--surface);text-decoration:none;display:flex;flex-direction:column;min-width:0}
.journal-image{height:245px;overflow:hidden}
.journal-image img{transition:transform .65s}
.journal-card:hover .journal-image img{transform:scale(1.04)}
.journal-body{padding:22px 23px 25px}
.journal-body small{color:var(--muted);font-size:9px;letter-spacing:.17em}
.journal-body h3{font:700 23px/1.4 var(--sans);letter-spacing:-.02em;margin:10px 0}
.journal-body p{color:var(--muted);font-size:12px;margin:0}
.journal-more{display:inline-block;margin-top:18px;color:var(--green);font-size:10px;letter-spacing:.13em}
.closing{position:relative;min-height:490px;display:grid;place-items:center;text-align:center;color:#fff;padding:80px 24px;overflow:hidden}
.closing>img{position:absolute;inset:0}
.closing:after{content:"";position:absolute;inset:0;background:#19352b8f}
.closing-content{position:relative;z-index:1;max-width:720px}
.closing h2{font:700 clamp(38px,6vw,68px)/1.25 var(--sans);letter-spacing:-.03em;margin:20px 0}
.closing p{color:#ffffffce;font-size:13px;margin:0 auto 28px}
.button-light{display:inline-flex;align-items:center;gap:22px;padding:13px 22px;border:1px solid #ffffffb3;text-decoration:none;font-size:10px;font-weight:650;letter-spacing:.12em;transition:background .2s,color .2s}
.button-light:hover{background:#fff;color:#203a34}
.inner-page{padding:130px 5.5% 100px;max-width:1320px;margin:auto}
.breadcrumbs{font-size:10px;letter-spacing:.12em;color:var(--muted);margin:0 0 25px}
.breadcrumbs a{text-decoration:none}
.page-hero{position:relative;min-height:380px;color:#fff;display:flex;align-items:end;padding:54px clamp(28px,6vw,82px);margin-bottom:55px;overflow:hidden;background:#294b43}
.page-hero>img{position:absolute;inset:0}
.page-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#14251fc9,transparent 90%),linear-gradient(0deg,#14251f67,transparent 70%)}
.page-hero-copy{position:relative;z-index:1;width:min(100%,820px);min-width:0}
.page-hero h1{font:700 clamp(34px,6vw,68px)/1.2 var(--sans);letter-spacing:-.03em;max-width:100%;overflow-wrap:anywhere;margin:15px 0 8px}
.page-hero p{margin:0;color:#ffffffce;font-size:13px}
.filter-row{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 27px}
.filter-button{border:1px solid var(--line);background:transparent;padding:8px 17px;border-radius:40px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.filter-button.active,.filter-button:hover{background:var(--green);border-color:var(--green);color:#fff}
.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.catalog-card{background:var(--surface);text-decoration:none;position:relative;overflow:hidden}
.catalog-image{aspect-ratio:4/3;overflow:hidden;position:relative;background:#293b37}
.catalog-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s}
.catalog-card:hover .catalog-image img{transform:scale(1.04)}
.catalog-body{padding:20px 22px 24px}
.catalog-body h2,.catalog-body h3{font:700 25px/1.3 var(--sans);letter-spacing:-.02em;margin:0 0 5px}
.catalog-body p{font-size:12px;color:var(--muted);margin:7px 0}
.catalog-body .eyebrow{font-size:9px;color:var(--muted)}
.price{color:var(--green);font:700 20px var(--sans)}
.route-card{position:relative}
.route-days{position:absolute;top:15px;left:15px;padding:6px 10px;background:#f5f2ebed;color:#263d36;font-size:9px;font-weight:650;letter-spacing:.1em}
.favorite{position:absolute;right:15px;top:15px;width:38px;height:38px;border:0;border-radius:50%;background:#f5f2ebed;color:#294b43;cursor:pointer;font-size:17px}
.favorite-wide{position:static;width:auto;height:44px;border:1px solid var(--green);border-radius:0;padding:0 16px;background:transparent;color:var(--green);font-size:11px}
.favorite-wide.is-saved{background:var(--green);color:#fff}
.favorite.is-saved{background:#294b43;color:#fff}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:55px;align-items:start}
.detail-copy h2,.content-title{font:700 32px/1.3 var(--sans);letter-spacing:-.025em;margin:0 0 20px}
.detail-copy p{color:var(--muted);font-size:13px}
.highlight-list{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}
.highlight{border:1px solid var(--line);padding:8px 13px;color:var(--muted);font-size:11px}
.detail-aside{position:sticky;top:105px;background:var(--surface);padding:27px}
.detail-aside p{color:var(--muted);font-size:12px}
.outline-button,.solid-button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 21px;text-decoration:none;font-size:10px;font-weight:650;letter-spacing:.1em;cursor:pointer}
.outline-button{border:1px solid var(--green);color:var(--green);background:transparent}
.solid-button{border:1px solid var(--green);color:#fff;background:var(--green)}
.solid-button:hover{background:var(--green-dark)}
.timeline{border-left:1px solid var(--gold);padding-left:24px;margin:28px 0}
.timeline-item{position:relative;padding:0 0 25px}
.timeline-item:before{content:"";position:absolute;left:-29px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.timeline-item b{display:block;color:var(--green);font:700 18px var(--sans);margin-bottom:4px}
.timeline-item p{margin:0}
.guide-list{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.guide-list details{background:var(--surface);border:1px solid var(--line);padding:20px 22px}
.guide-list summary{cursor:pointer;font:650 20px var(--sans)}
.guide-list details p{color:var(--muted);font-size:12px;margin:12px 0 0}
.contact-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}
.contact-copy h2{font:700 clamp(34px,4vw,52px)/1.25 var(--sans);letter-spacing:-.03em;margin:0 0 18px}
.contact-copy p{font-size:13px;color:var(--muted)}
.contact-form{background:var(--surface);padding:clamp(25px,5vw,48px)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:block;margin-bottom:17px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);padding:12px 0;font-size:13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.field textarea{resize:vertical;min-height:95px}
.form-message{min-height:25px;color:#9e493e;font-size:12px}
.form-message.success{color:var(--green)}
.site-footer{background:#20362f;color:#f4f3ed;padding:65px 5.5% 25px}
.footer-top{width:min(1320px,100%);margin:auto;display:flex;align-items:start;justify-content:space-between;gap:45px;padding-bottom:48px}
.footer-brand{font:700 26px var(--sans);letter-spacing:.04em}
.footer-brand p{color:#ffffffb8;font:600 10px var(--sans);letter-spacing:.1em}
.footer-links{display:flex;flex-wrap:wrap;gap:17px 30px}
.footer-links a{color:#ffffffd1;text-decoration:none;font-size:10px;font-weight:600;letter-spacing:.08em}
.footer-bottom{width:min(1320px,100%);margin:auto;border-top:1px solid #ffffff30;padding-top:18px;display:flex;justify-content:space-between;color:#ffffff80;font-size:9px;letter-spacing:.1em}
.back-top{position:fixed;right:22px;bottom:22px;z-index:10;width:43px;height:43px;border:1px solid var(--line);background:var(--surface);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer}
.back-top.show{opacity:1;pointer-events:auto}
.reveal{animation:rise .65s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slow-zoom{from{transform:scale(1.04)}to{transform:scale(1)}}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media(max-width:900px){.nav-wrap{gap:20px}.nav-links{gap:19px}.destination-card{min-height:350px}.experience{grid-template-columns:1fr 1fr}.journal-grid{gap:14px}.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-layout{grid-template-columns:1fr 260px;gap:30px}}
@media(max-width:860px){.nav-wrap{height:70px;padding:0 22px;gap:18px}.nav-links{display:none;position:absolute;top:70px;left:0;right:0;padding:16px 24px 23px;background:var(--surface);color:var(--ink);flex-direction:column;align-items:stretch;gap:0;box-shadow:var(--shadow)}.nav-links.open{display:flex}.nav-links a{padding:12px 0;border-bottom:1px solid var(--line)}.menu-button{display:grid}}
@media(max-width:700px){.nav-actions{gap:8px}.brand-copy small{white-space:nowrap}.nav-book{padding:9px 10px;font-size:9px;letter-spacing:.08em;white-space:nowrap;flex:none}.hero{min-height:640px;height:92svh}.hero-copy{left:8%;top:45%;width:82%}.hero h1{font-size:clamp(46px,13vw,74px)}.hero-copy p{font-size:12px}.scroll-note{display:none}.hero-bottom{left:8%;right:8%;bottom:28px}.intro{padding:90px 8%}.section{padding:0 6% 90px}.section-heading{align-items:start;flex-direction:column;gap:12px}.section-note{max-width:420px}.destination-grid{grid-template-columns:1fr;gap:14px}.destination-card,.destination-card:nth-child(n){grid-column:auto;min-height:390px}.experience{grid-template-columns:1fr;margin-bottom:90px}.experience-photo{min-height:340px}.experience-copy{padding:50px 9% 58px}.journal-grid{grid-template-columns:1fr}.journal-image{height:260px}.closing{min-height:420px}.inner-page{padding:105px 6% 75px}.page-hero{min-height:330px;margin-bottom:36px;padding:34px 25px}.catalog-grid{grid-template-columns:1fr}.catalog-image{height:260px}.detail-layout{grid-template-columns:1fr}.detail-aside{position:static}.guide-list{grid-template-columns:1fr}.contact-layout{grid-template-columns:1fr;gap:28px}.form-row{grid-template-columns:1fr;gap:0}.footer-top{flex-direction:column;padding-bottom:30px}.footer-links{gap:14px 22px}.footer-bottom{gap:15px;flex-direction:column}.back-top{right:14px;bottom:14px}}
@media(max-width:380px){.nav-wrap{padding:0 16px}.brand-copy small{display:none}.icon-button,.menu-button{width:36px;height:36px}.nav-book{padding:9px 8px}}
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:30;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:linear-gradient(90deg,var(--gold),#efe2bf)}
h1,h2,h3{text-wrap:balance}
.nav-wrap{transition:height .5s cubic-bezier(.16,1,.3,1)}
@media(min-width:861px){.site-header.is-scrolled .nav-wrap{height:62px}}
.nav-book,.solid-button,.outline-button,.button-light,.highlight{border-radius:999px}
.route-days{border-radius:999px;backdrop-filter:blur(10px)}
.destination-card,.catalog-card,.journal-card,.page-hero,.detail-aside,.contact-form,.guide-list details,.experience,.closing{border-radius:24px;isolation:isolate}
.journal-card{overflow:hidden}
.catalog-card,.journal-card,.detail-aside,.contact-form{box-shadow:var(--shadow);border:1px solid var(--line)}
.experience,.closing{width:min(1320px,89%);margin-inline:auto}
.closing{margin-bottom:70px}
.hero h1 em{background:linear-gradient(100deg,#f4e7c4,#c8aa70);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.section-title em{background:linear-gradient(100deg,var(--green),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero-dot{transition:width .5s,background .5s,border-radius .5s}
.hero-dot.active{width:24px;border-radius:6px;transform:none}
.scroll-note{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(10px);opacity:.35}}
@keyframes kin{from{opacity:0;transform:translateY(46px);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
.hero-slide{transform:scale(calc(1 + var(--p,0)*.12))}
.hero-copy{opacity:calc(1 - var(--p,0)*1.7)}
.hero-slide.active .hero-copy>*{animation:kin 1.3s cubic-bezier(.16,1,.3,1) both}
.hero-slide.active .hero-copy>:nth-child(2){animation-delay:.18s}
.hero-slide.active .hero-copy>:nth-child(3){animation-delay:.36s}
.hero-slide.active .hero-copy>:nth-child(4){animation-delay:.54s}
.page-hero-copy>*{animation:kin 1.2s cubic-bezier(.16,1,.3,1) both}
.page-hero-copy>:nth-child(2){animation-delay:.15s}
.page-hero-copy>:nth-child(3){animation-delay:.3s}
.page-hero>img,.experience-photo img,.closing>img{transform:scale(calc(1.28 - var(--p,.5)*.28))}
.destination-card img{transform:translateY(calc((.5 - var(--p,.5))*80px)) scale(1.16);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.destination-card:hover img{transform:translateY(calc((.5 - var(--p,.5))*80px)) scale(1.24)}
.ch{opacity:.16;transition:opacity .3s}
.rv{opacity:0;transform:translateY(52px) scale(.96);filter:blur(10px);transition:opacity 1.1s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1),filter 1.1s;transition-delay:calc(var(--i,0)*100ms)}

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const D=[
  {id:'hz',n:'杭州',en:'HANGZHOU',e:'水岸与宋韵',t:'人文',s:'春 · 秋',c:['#274f49','#91a79b'],d:'在西湖的晨雾里慢下来，让一盏龙井，带你走进江南的日常。',h:['西湖','灵隐寺','龙井村','河坊街'],img:'https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1600&q=85'},
  {id:'cd',n:'成都',en:'CHENGDU',e:'烟火与闲适',t:'美食',s:'3 – 6 月',c:['#553d32','#bd8a5e'],d:'从清晨的茶馆到夜色里的街巷，在松弛的节奏中遇见鲜活蜀地。',h:['大熊猫基地','宽窄巷子','都江堰','锦里'],img:'https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b?auto=format&fit=crop&w=1600&q=85'},
  {id:'xa',n:'西安',en:'XI’AN',e:'长安与回响',t:'历史',s:'4 – 5 月 · 9 – 10 月',c:['#664a35','#b58b5d'],d:'穿过城墙与古巷，循着一座城的千年回声，读懂长安的从容。',h:['兵马俑','古城墙','大雁塔','回民街'],img:'https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1600&q=85'},
  {id:'gl',n:'桂林',en:'GUILIN',e:'山水与诗意',t:'山水',s:'4 – 10 月',c:['#314f43','#83a58a'],d:'把时间交给漓江、群山与竹筏，让眼前的风景成为旅程本身。',h:['漓江','象鼻山','阳朔西街','龙脊梯田'],img:'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=85'}
];
const R=[
  {id:'1',n:'江南 · 水岸慢行',d:'hz',days:4,p:2680,tag:'湖畔人文',l:['抵达杭州，在西湖边散步，入住湖畔雅居','灵隐寻幽，走进龙井村，在茶园里享用午后','乘船前往乌镇，体验枕水人家的夜色','西溪湿地晨游，以一顿杭帮早餐作别江南']},
  {id:'2',n:'蜀地 · 风物与烟火',d:'cd',days:5,p:3180,tag:'美食闲适',l:['抵达成都，在宽窄巷子感受老城日常','清晨探访熊猫基地，午后回到茶馆歇脚','走近都江堰，读懂山水间的古老智慧','跟随主厨走进菜市场，体验一席川味','留一整天给自己，在成都慢慢告别']},
  {id:'3',n:'长安 · 城墙内外',d:'xa',days:4,p:2980,tag:'历史漫游',l:['抵达西安，沿着回民街开启长安夜游','走进兵马俑与华清宫，聆听秦风唐韵','登上古城墙骑行，在大雁塔下看一场日落','探访陕西历史博物馆，带着故事返程']}
];
const G=[
  ['轻装出发','带上证件、常用药、防晒与一双舒适的鞋。根据目的地天气分层准备衣物，让行李留一点余地给旅途中的惊喜。'],
  ['把时间留给风景','避开节假日高峰，选择清晨或日落时分走进热门景点。热门场馆建议提前预约，把行程安排得松弛一些。'],
  ['住在生活附近','优先选择交通便利、步行可达街区的住宿。提前了解当地交通与营业时间，留出自由探索的空间。'],
  ['为旅程留白','不必把每个小时都填满。留一段没有计划的时间，也许会遇见旅途中最难忘的风景。']
];
const S=[D[0],D[3],D[2]];
let fav=[];
try{fav=JSON.parse(localStorage.getItem('journey-favorites')||'[]');if(!Array.isArray(fav))fav=[]}catch(e){fav=[]}
let si=0,tm,cur='';
const dd=id=>D.find(d=>d.id===id)||D[0];
const image=(src,alt,attrs='',loading='lazy')=>`<img src="${src}" alt="${alt}" ${attrs} loading="${loading}" onerror="fb(this)">`;
const art=(c,n)=>{const x=900+n%5*90,v=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><circle cx="${x}" cy="300" r="90" fill="#f3e6c4" opacity=".55"/><path d="M0 620L260 380 480 560 760 330 1040 590 1300 400 1600 600V900H0Z" fill="${c[0]}" opacity=".45"/><path d="M0 720L300 520 560 690 900 480 1200 700 1600 540V900H0Z" fill="${c[0]}" opacity=".7"/><path d="M0 800Q400 740 800 800T1600 790V900H0Z" fill="${c[0]}"/></svg>`;return'data:image/svg+xml;utf8,'+encodeURIComponent(v)};
const fb=el=>{if(el.dataset.f)return;el.dataset.f=1;const d=D.find(x=>x.img===el.getAttribute('src'));el.src=art(d?d.c:['#294b43','#b79b68'],el.alt.length)};
const crumbs=(label)=>`<p class="breadcrumbs"><a href="#home" data-go="home">首页</a>　/　${label}</p>`;
const destinationCard=d=>`<a class="destination-card" href="#d-${d.id}" data-go="d-${d.id}">${image(d.img,`${d.n}风景`)}<div class="destination-meta"><div><small>${d.en}　·　${d.e}</small><h3>${d.n}</h3><p>${d.d}</p></div><span class="destination-arrow" aria-hidden="true">↗</span></div></a>`;
const routeCard=r=>{const d=dd(r.d);return `<article class="catalog-card route-card">${image(d.img,`${d.n}旅行风景`)}<span class="route-days">${r.days} DAYS · ${r.tag}</span><button class="favorite${fav.includes(r.id)?' is-saved':''}" type="button" data-fav="${r.id}" aria-label="${fav.includes(r.id)?'取消收藏':'收藏'}${r.n}" aria-pressed="${fav.includes(r.id)}">${fav.includes(r.id)?'♥':'♡'}</button><div class="catalog-body"><span class="eyebrow">${d.en}　/　${r.days} 日</span><h3>${r.n}</h3><p>${d.d}</p><p><span class="price">¥${r.p}</span> <span class="mu">/ 人起</span></p><a class="text-link" href="#r-${r.id}" data-go="r-${r.id}">查看旅程 <span aria-hidden="true">→</span></a></div></article>`};
const hero=()=>`<section class="hero" aria-label="精选目的地">
  ${S.map((d,i)=>`<article class="hero-slide${i===0?' active':''}" aria-hidden="${i!==0}">${image(d.img,`${d.n}目的地风光`,i===0?'fetchpriority="high"':'','eager')}<div class="hero-shade"></div><div class="hero-copy"><span class="eyebrow">A JOURNEY THROUGH CHINA</span><h1>${d.n}，<br><em>${d.e}</em></h1><p>${d.d}</p><a class="text-link" href="#d-${d.id}" data-go="d-${d.id}">发现这段旅程 <span aria-hidden="true">↗</span></a></div></article>`).join('')}
  <span class="scroll-note">SCROLL TO DISCOVER</span>
  <div class="hero-bottom"><span class="hero-count"><b id="slide-current">01</b>　/　0${S.length}</span><div class="hero-controls"><button class="hero-arrow" type="button" data-slide="-1" aria-label="上一张">←</button><div class="hero-dots">${S.map((_,i)=>`<button class="hero-dot${i===0?' active':''}" type="button" data-s="${i}" aria-label="第 ${i+1} 张"></button>`).join('')}</div><button class="hero-arrow" type="button" data-slide="1" aria-label="下一张">→</button></div></div>
</section>`;
const H=()=>`${hero()}
  <section class="intro"><span class="eyebrow">A DIFFERENT WAY TO SEE CHINA</span><h2>不只是去一个地方。<br>而是找到<em>属于你的旅行节奏。</em></h2><p>从熟悉的山水，到尚未写下的故事。我们用用心设计的旅程，陪你重新发现中国的辽阔与温度。</p></section>
  <section class="section"><div class="section-heading"><div><span class="eyebrow">PLACES WITH A SOUL</span><h2 class="section-title">每一处风景，<em>都有自己的性格。</em></h2></div><p class="section-note">去水岸边、古城中或山野间，选择一个此刻最想抵达的地方。</p></div><div class="destination-grid">${D.map(destinationCard).join('')}</div></section>
  <section class="experience"><div class="experience-photo">${image('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85','山水之间的旅行风景')}</div><div class="experience-copy"><span class="eyebrow">TRAVEL, THOUGHTFULLY MADE</span><h2>好的旅程，<br>从来不只是<em>抵达。</em></h2><p>一位懂得留白的行程设计师，一处恰到好处的落脚，一些不被催促的时刻。我们相信，值得记住的旅行，应该真正属于你。</p><a class="text-link" href="#contact" data-go="contact">聊聊你的下一程 <span aria-hidden="true">↗</span></a></div></section>
  <section class="section"><div class="section-heading"><div><span class="eyebrow">JOURNEYS TO REMEMBER</span><h2 class="section-title">为你安排好，<em>也为意外留点位置。</em></h2></div><a class="text-link" href="#routes" data-go="routes">浏览全部旅程 <span aria-hidden="true">↗</span></a></div><div class="catalog-grid">${R.map(routeCard).join('')}</div></section>
  <section class="section"><div class="section-heading"><div><span class="eyebrow">NOTES FOR THE ROAD</span><h2 class="section-title">出发之前，<em>读一点旅行灵感。</em></h2></div><a class="text-link" href="#guide" data-go="guide">阅读出行建议 <span aria-hidden="true">↗</span></a></div><div class="journal-grid">${G.slice(0,3).map((g,i)=>`<a class="journal-card" href="#guide" data-go="guide"><div class="journal-image">${image([D[0].img,D[1].img,D[3].img][i],g[0])}</div><div class="journal-body"><small>FIELD NOTES　/　0${i+1}</small><h3>${g[0]}</h3><p>${g[1].slice(0,48)}…</p><span class="journal-more">继续阅读　↗</span></div></a>`).join('')}</div></section>
  <section class="closing">${image('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1800&q=85','日落时分的山野风景')}<div class="closing-content"><span class="eyebrow">YOUR NEXT CHAPTER BEGINS HERE</span><h2>下一段故事，<br>从一次出发开始。</h2><p>告诉我们你想去哪里。剩下的，让我们一起慢慢规划。</p><a class="button-light" href="#contact" data-go="contact">定制一段属于你的旅程　↗</a></div></section>`;
const pageHero=(title,desc,d=D[0])=>`<section class="page-hero">${image(d.img,`${title}风景`,'','eager')}<div class="page-hero-copy"><span class="eyebrow">${d.en}</span><h1>${title}</h1><p>${desc}</p></div></section>`;
const DL=()=>`<div class="inner-page">${crumbs('目的地')}${pageHero('去喜欢的地方','在山水、街巷与古老故事之间，找到下一站。')}<div class="filter-row">${['全部',...new Set(D.map(d=>d.t))].map((t,i)=>`<button class="filter-button${i===0?' active':''}" type="button" data-f="${t}">${t}</button>`).join('')}</div><div class="catalog-grid" id="gd">${D.map(d=>`<a class="catalog-card" data-t="${d.t}" href="#d-${d.id}" data-go="d-${d.id}"><div class="catalog-image">${image(d.img,`${d.n}风景`)}</div><div class="catalog-body"><span class="eyebrow">${d.en}　/　${d.e}</span><h2>${d.n}</h2><p>${d.d}</p><p class="mu">适宜季节：${d.s}</p></div></a>`).join('')}</div></div>`;
const DD=id=>{const d=dd(id);const related=R.filter(r=>r.d===d.id);return `<div class="inner-page">${crumbs(`<a href="#dest" data-go="dest">目的地</a>　/　${d.n}`)}${pageHero(d.n,d.d,d)}<div class="detail-layout"><section class="detail-copy"><span class="eyebrow">${d.en}　·　${d.e}</span><h2>把脚步，交给这座城。</h2><p>${d.d} 不必追赶每一个景点，沿着当地人的日常慢慢走，风景自会出现。</p><h2 class="content-title">值得停留的地方</h2><div class="highlight-list">${d.h.map(x=>`<span class="highlight">${x}</span>`).join('')}</div><p>适宜季节：${d.s}　·　旅行主题：${d.t}</p>${related.length?`<h2 class="content-title" style="margin-top:50px">为你准备的旅程</h2><div class="catalog-grid">${related.map(routeCard).join('')}</div>`:''}</section><aside class="detail-aside"><span class="eyebrow">A LITTLE MORE PERSONAL</span><p>想让这段旅程更贴近你的喜好？告诉我们出发时间和同行的人，我们会为你认真安排。</p><button class="favorite favorite-wide${fav.includes(d.id)?' is-saved':''}" type="button" data-fav="${d.id}" aria-label="收藏${d.n}" aria-pressed="${fav.includes(d.id)}">${fav.includes(d.id)?'♥ 已收藏':'♡ 收藏目的地'}</button><p><a class="solid-button" href="#contact" data-go="contact">咨询行程顾问</a></p></aside></div></div>`};
const RL=()=>`<div class="inner-page">${crumbs('精选旅程')}${pageHero('让旅程，有自己的节奏','精心安排每一天，也留出随心而行的余地。',D[1])}<div class="section-heading"><div><span class="eyebrow">CURATED FOR YOU</span><h2 class="section-title">慢慢走，<em>看见更多。</em></h2></div><p class="section-note">价格为每人参考起价，具体安排可按你的偏好调整。</p></div><div class="catalog-grid">${R.map(routeCard).join('')}</div></div>`;
const RD=id=>{const r=R.find(x=>x.id===id)||R[0],d=dd(r.d);return `<div class="inner-page">${crumbs(`<a href="#routes" data-go="routes">精选旅程</a>　/　${r.n}`)}${pageHero(r.n,`${d.n} · ${r.days} 日 · ${r.tag}`,d)}<div class="detail-layout"><section class="detail-copy"><span class="eyebrow">A THOUGHTFUL ITINERARY</span><h2>行程安排</h2><p>每天都有值得期待的风景，也有自在呼吸的时间。以下为旅程参考安排，可根据你的想法调整。</p><div class="timeline">${r.l.map((t,i)=>`<div class="timeline-item"><b>第 ${String(i+1).padStart(2,'0')} 天</b><p>${t}</p></div>`).join('')}</div></section><aside class="detail-aside"><span class="eyebrow">YOUR JOURNEY, YOUR WAY</span><p><span class="price">¥${r.p}</span> / 人起</p><p>${r.days} 日 · ${d.n} · ${r.tag}</p><p>参考价格包含行程规划与精选体验，最终费用将根据出发日期和人数确认。</p><p><a class="solid-button" href="#contact" data-go="contact">咨询这段旅程</a></p></aside></div></div>`};
const GD=()=>`<div class="inner-page">${crumbs('旅行灵感')}${pageHero('让出发这件事，简单一点','一些朴素的建议，陪你从容地开始下一段旅程。',D[3])}<span class="eyebrow">NOTES BEFORE YOU GO</span><h2 class="section-title" style="margin-bottom:30px">旅行准备，<em>不必复杂。</em></h2><div class="guide-list">${G.map(g=>`<details><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join('')}</div></div>`;
const CT=()=>`<div class="inner-page">${crumbs('定制旅程')}${pageHero('说说你想去哪里','我们会认真听，再为你规划一段合适的旅程。',D[2])}<div class="contact-layout"><div class="contact-copy"><span class="eyebrow">LET’S PLAN SOMETHING MEANINGFUL</span><h2>从一个念头，<br>开始一段旅程。</h2><p>留下你的联系方式与旅行想法，我们会在 24 小时内与你联系。这里的表单是演示交互，不会向服务器发送信息。</p></div><form class="contact-form" id="contact-form" novalidate><div class="form-row"><label class="field">怎么称呼你<input name="n" autocomplete="name" placeholder="你的姓名" required></label><label class="field">联系电话<input name="p" type="tel" inputmode="numeric" autocomplete="tel" placeholder="11 位手机号码" required></label></div><label class="field">想去哪里<select name="destination"><option value="">还没有决定</option>${D.map(d=>`<option value="${d.id}">${d.n}</option>`).join('')}</select></label><label class="field">说说你的想法<textarea name="m" rows="3" placeholder="出发时间、同行人数，或任何期待……"></textarea></label><p class="form-message" id="msg" role="status" aria-live="polite"></p><button class="solid-button" type="submit">提交旅行想法　→</button></form></div></div>`;
function show(i){si=(i+S.length)%S.length;$$('.hero-slide').forEach((el,k)=>{el.classList.toggle('active',k===si);el.setAttribute('aria-hidden',String(k!==si))});$$('.hero-dot').forEach((el,k)=>el.classList.toggle('active',k===si));const count=$('#slide-current');if(count)count.textContent=String(si+1).padStart(2,'0')}
function startSlider(){clearInterval(tm);if($('#main .hero-slide'))tm=setInterval(()=>show(si+1),6500)}
function go(id,updateHash=true){clearInterval(tm);const [kind,arg]=id.split('-');let html;
  if(id==='dest')html=DL();else if(kind==='d'&&arg)html=DD(arg);else if(id==='routes')html=RL();else if(kind==='r'&&arg)html=RD(arg);else if(id==='guide')html=GD();else if(id==='contact')html=CT();else{id='home';html=H()}
  $('#main').innerHTML=html;$('#main').classList.remove('reveal');void $('#main').offsetWidth;$('#main').classList.add('reveal');
  const navTarget=kind==='d'?'dest':kind==='r'?'routes':id;$$('.nav-links a').forEach(a=>a.classList.toggle('on',a.dataset.go===navTarget));$('#header').classList.toggle('is-page',id!=='home');
  $('#nv').classList.remove('open');$('#bg').setAttribute('aria-expanded','false');cur=id;
  if(updateHash&&location.hash!==`#${id}`)history.pushState(null,'',`#${id}`);
  window.scrollTo({top:0,behavior:'instant'});startSlider();fx();
}
document.addEventListener('click',e=>{const target=e.target;if(!(target instanceof Element))return;let el;
  if(el=target.closest('[data-go]')){e.preventDefault();go(el.dataset.go)}
  else if(el=target.closest('[data-s]'))show(Number(el.dataset.s))
  else if(el=target.closest('[data-slide]'))show(si+Number(el.dataset.slide))
  else if(el=target.closest('[data-f]')){$$('[data-f]').forEach(x=>x.classList.toggle('active',x===el));$$('#gd [data-t]').forEach(card=>card.hidden=el.dataset.f!=='全部'&&card.dataset.t!==el.dataset.f)}
  else if(el=target.closest('[data-fav]')){const id=el.dataset.fav;fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];try{localStorage.setItem('journey-favorites',JSON.stringify(fav))}catch(error){console.warn('无法保存收藏状态。',error)}el.classList.toggle('is-saved',fav.includes(id));el.setAttribute('aria-pressed',String(fav.includes(id)));el.setAttribute('aria-label',`${fav.includes(id)?'取消收藏':'收藏'}${D.find(d=>d.id===id)?.n||R.find(r=>r.id===id)?.n||'目的地'}`);if(el.matches('.favorite'))el.innerHTML=el.classList.contains('favorite-wide')?(fav.includes(id)?'♥ 已收藏':'♡ 收藏目的地'):(fav.includes(id)?'♥':'♡')}
});
document.addEventListener('submit',e=>{if(!(e.target instanceof HTMLFormElement)||e.target.id!=='contact-form')return;e.preventDefault();const form=e.target,msg=$('#msg'),name=form.elements.namedItem('n').value.trim(),phone=form.elements.namedItem('p').value.trim();msg.classList.remove('success');
  if(!name){msg.textContent='请填写你的姓名。';form.elements.namedItem('n').focus()}
  else if(!/^1[3-9]\d{9}$/.test(phone)){msg.textContent='请输入有效的 11 位中国大陆手机号码。';form.elements.namedItem('p').focus()}
  else{msg.classList.add('success');msg.textContent='收到你的旅行想法了（演示页面未发送数据）。';form.reset()}
});
$('#bg').addEventListener('click',()=>{const open=$('#nv').classList.toggle('open');$('#bg').setAttribute('aria-expanded',String(open))});
$('#th').addEventListener('click',()=>{const root=document.documentElement,next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('journey-theme',next)}catch(error){console.warn('无法保存主题设置。',error)}});
$('#up').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('scroll',()=>{$('#header').classList.toggle('is-scrolled',window.scrollY>30);$('#up').classList.toggle('show',window.scrollY>500)});
window.addEventListener('popstate',()=>{const id=location.hash.slice(1)||'home';if(id!==cur)go(id,false)});
try{const theme=localStorage.getItem('journey-theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme}catch(error){console.warn('无法读取主题设置。',error)}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
let ob,fxEls=[],fxBound=false,raf=0;
const RV='.section-heading,.destination-card,.catalog-card,.journal-card,.experience-copy>*,.closing-content>*,.timeline-item,.guide-list details,.detail-aside,.contact-form,.contact-copy>*,.highlight,.filter-row,.intro p,.intro .eyebrow,.breadcrumbs';
function splitChars(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{const f=document.createDocumentFragment();[...n.textContent].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c;f.appendChild(s)});n.replaceWith(f)});return[...el.querySelectorAll('.ch')]}
function tick(){raf=0;const vh=innerHeight,h=document.documentElement;h.style.setProperty('--sp',cl(scrollY/Math.max(1,h.scrollHeight-vh)).toFixed(4));fxEls.forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<-300||r.top>vh+300)return;if(el._c){const p=cl((vh*.88-r.top)/(vh*.43+r.height)),N=el._c.length;el._c.forEach((c,i)=>c.style.opacity=(.16+.84*cl((p*(N+10)-i)/10)).toFixed(2));return}el.style.setProperty('--p',(el.classList.contains('hero')?cl(scrollY/r.height):cl((vh-r.top)/(vh+r.height))).toFixed(3))})}
function fx(){ob&&ob.disconnect();ob=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ob.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -5% 0px'});$$(RV).forEach(el=>{el.classList.add('rv');el.style.setProperty('--i',[...el.parentNode.children].indexOf(el)%4);ob.observe(el)});const h=$('.intro h2');if(h)h._c=splitChars(h);fxEls=[...$$('.hero,.experience,.closing,.page-hero,.destination-card')];if(h)fxEls.push(h);if(!fxBound){fxBound=true;const q=()=>raf||(raf=requestAnimationFrame(tick));addEventListener('scroll',q,{passive:true});addEventListener('resize',q)}tick()}
go(location.hash.slice(1)||'home',false);
</script>
</body>
</html>
